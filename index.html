<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%231E3A2B"/><text x="16" y="21" font-family="Georgia,serif" font-size="13" fill="%23F2EFE7" text-anchor="middle">AWL</text></svg>'>
<title>AWL Sublist 5–10 · 单词表</title>
<style>
  :root{
    --paper:#F2EFE7;
    --paper-2:#FAF8F2;
    --ink:#17150F;
    --ink-2:#3B382F;
    --muted:#7C7668;
    --line:#DAD4C6;
    --line-strong:#C2BAA9;
    --accent:#1E3A2B;
    --accent-soft:#E2E8DF;
    --rust:#8A3A26;
    --radius:18px;
    --font-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC","STSong",serif;
    --font-sans:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  svg{display:block}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }
  .shell{max-width:1180px;margin:0 auto;padding:0 32px}
  @media (max-width:640px){.shell{padding:0 20px}}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:40px;
    padding:54px 0 30px;
    border-bottom:1px solid var(--line-strong);
  }
  .kicker{
    display:flex;align-items:center;gap:10px;
    font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--muted);margin:0 0 16px;
  }
  .kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--rust)}
  h1{
    margin:0;
    font-family:var(--font-serif);
    font-weight:400;
    font-size:clamp(40px,5.2vw,66px);
    line-height:.94;
    letter-spacing:-.015em;
  }
  h1 em{
    font-style:italic;
    color:var(--accent);
  }
  .lede{
    margin:14px 0 0;color:var(--ink-2);font-size:13.5px;letter-spacing:.02em;
  }
  .progress-block{flex:0 0 268px;padding-bottom:4px}
  .progress-label{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
    margin-bottom:6px;
  }
  .progress-read{display:flex;align-items:baseline;gap:8px}
  .progress-read strong{
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(46px,5vw,62px);line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .progress-read span{font-family:var(--font-serif);font-size:19px;color:var(--muted)}
  .bar{
    height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 8px;
  }
  .bar i{
    display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .progress-note{font-size:11.5px;color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}

  /* ---------- unit switcher ---------- */
  .units{
    display:flex;gap:7px;overflow-x:auto;
    padding:20px 0 20px;
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .units::-webkit-scrollbar{display:none}
  .unit-tab{
    flex:0 0 auto;
    display:flex;flex-direction:column;gap:2px;
    min-width:102px;
    padding:9px 15px 10px;
    border:1px solid var(--line-strong);border-radius:13px;
    background:transparent;text-align:left;
    transition:background .18s,border-color .18s,color .18s,transform .12s;
  }
  .unit-tab:hover{background:rgba(255,253,247,.7);border-color:var(--ink-2)}
  .unit-tab:active{transform:translateY(1px)}
  .unit-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .unit-tab .u-label{
    font-family:var(--font-serif);font-size:15.5px;letter-spacing:.01em;line-height:1.2;
    white-space:nowrap;
  }
  .unit-tab .u-count{
    font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .unit-tab .u-bar{
    height:2px;border-radius:99px;background:var(--line);
    margin-top:5px;overflow:hidden;width:100%;
  }
  .unit-tab .u-bar i{
    display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
    transition:width .4s ease;
  }
  .unit-tab.active{
    background:var(--ink);border-color:var(--ink);color:var(--paper-2);
  }
  .unit-tab.active .u-count{color:rgba(250,248,242,.62)}
  .unit-tab.active .u-bar{background:rgba(250,248,242,.22)}
  .unit-tab.active .u-bar i{background:#A9C4B2}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:rgba(242,239,231,.92);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .toolbar-inner{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 0;
  }
  .search{
    position:relative;flex:1 1 240px;min-width:200px;
    display:flex;align-items:center;
  }
  .search svg{
    position:absolute;left:14px;width:16px;height:16px;stroke:var(--muted);
    fill:none;stroke-width:1.6;pointer-events:none;
  }
  .search input{
    width:100%;height:42px;padding:0 38px 0 40px;
    background:var(--paper-2);border:1px solid var(--line-strong);border-radius:99px;
    font-size:13.5px;letter-spacing:.01em;
    outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
  }
  .search input::placeholder{color:#9A9384}
  .search input:focus{
    border-color:var(--accent);background:#FFFDF8;
    box-shadow:0 0 0 3px rgba(30,58,43,.12);
  }
  .search-clear{
    position:absolute;right:7px;width:28px;height:28px;border:0;background:none;
    color:var(--muted);border-radius:50%;font-size:16px;line-height:1;
    display:none;align-items:center;justify-content:center;
  }
  .search-clear:hover{background:var(--line);color:var(--ink)}
  .search.has-value .search-clear{display:flex}

  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    height:38px;padding:0 14px;border-radius:99px;
    border:1px solid var(--line-strong);background:transparent;color:var(--ink-2);
    font-size:12.5px;letter-spacing:.02em;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .18s,color .18s,border-color .18s,transform .12s,opacity .18s;
  }
  .btn:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.34;cursor:not-allowed}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#F4F1E7}
  .btn.accent:hover:not(:disabled){background:#152A1E;border-color:#152A1E}
  .btn.quiet{color:var(--muted);border-color:var(--line)}
  .btn.quiet:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
  .btn .kbd{
    font-size:10px;letter-spacing:.1em;color:var(--muted);
    border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:15px;
  }
  .btn:hover:not(:disabled) .kbd{color:rgba(250,248,242,.6);border-color:rgba(250,248,242,.3)}
  .divider{width:1px;height:22px;background:var(--line);flex:0 0 auto}

  /* ---------- list ---------- */
  .list-meta{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:26px 4px 10px;
    font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  }
  .list-meta .count{font-variant-numeric:tabular-nums;letter-spacing:.1em}
  .entries{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-strong)}
  .entry{
    display:grid;
    grid-template-columns:46px minmax(170px,238px) 1fr auto;
    gap:24px;align-items:start;
    padding:24px 12px 24px 4px;
    border-bottom:1px solid var(--line);
    transition:opacity .3s ease,transform .3s ease,background .2s ease;
  }
  .entry:hover{background:rgba(255,253,247,.55)}
  .entry.leaving{opacity:0;transform:translateX(14px);pointer-events:none}
  .entry.flash{animation:flash 1.4s ease}
  @keyframes flash{
    0%{background:rgba(30,58,43,.10)}
    100%{background:transparent}
  }
  .idx{
    font-family:var(--font-serif);font-size:12px;color:var(--muted);
    padding-top:8px;letter-spacing:.06em;font-variant-numeric:tabular-nums;
  }
  .word-col{min-width:0}
  .word{
    margin:0;
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(24px,2.2vw,29px);line-height:1.12;letter-spacing:-.01em;
    overflow-wrap:anywhere;
  }
  .zh{
    margin:9px 0 0;color:var(--accent);font-size:13.5px;letter-spacing:.02em;
    transition:opacity .2s;
  }
  .use-col{min-width:0;padding-top:2px}
  .pos{
    display:inline-block;margin:0 0 7px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;
  }
  .colloc{
    margin:0;font-family:var(--font-serif);font-size:16.5px;line-height:1.4;color:var(--ink-2);
    overflow-wrap:anywhere;
  }
  .ex{
    margin:7px 0 0;font-size:12.5px;line-height:1.65;color:var(--muted);
    overflow-wrap:anywhere;
  }
  .master{
    align-self:center;
    height:38px;padding:0 16px;border-radius:99px;
    border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink-2);
    font-size:12px;letter-spacing:.04em;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;
    transition:background .18s,color .18s,border-color .18s,transform .12s;
  }
  .master svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
  .master:hover{background:var(--accent);border-color:var(--accent);color:#F4F1E7}
  .master:active{transform:scale(.97)}
  .master:focus-visible,.btn:focus-visible,.toggle-details:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* masked translation state */
  .details{transition:opacity .2s}
  .details.concealed .zh,
  .details.concealed .use-body{display:none}
  .reveal-hint{
    display:none;align-items:center;gap:8px;
    margin-top:10px;padding:10px 14px;
    border:1px dashed var(--line-strong);border-radius:12px;
    font-size:12px;color:var(--muted);letter-spacing:.06em;
    background:rgba(255,255,255,.28);
    width:fit-content;max-width:100%;
  }
  .details.concealed .reveal-hint{display:inline-flex}
  .reveal-hint span.underline{
    border-bottom:1px solid var(--line-strong);padding-bottom:1px;
  }

  /* empty states */
  .empty{
    padding:64px 8px 80px;text-align:center;
  }
  .empty .mark{
    font-family:var(--font-serif);font-size:38px;color:var(--line-strong);line-height:1;
  }
  .empty h3{margin:18px 0 6px;font-family:var(--font-serif);font-weight:400;font-size:24px}
  .empty p{margin:0;color:var(--muted);font-size:13px}
  .empty .btn{margin-top:20px}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    z-index:50;pointer-events:none;
    max-width:calc(100vw - 40px);
    padding:11px 20px;border-radius:99px;
    background:var(--ink);color:var(--paper-2);
    font-size:12.5px;letter-spacing:.03em;
    box-shadow:0 12px 32px rgba(23,21,15,.24);
    opacity:0;transition:opacity .22s ease,transform .22s ease;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  footer{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:30px 4px 46px;
    font-size:11px;letter-spacing:.05em;color:var(--muted);
  }
  footer .rule{flex:1;height:1px;background:var(--line)}

  @media (max-width:900px){
    .masthead{flex-direction:column;align-items:stretch;gap:28px;padding:38px 0 26px}
    .progress-block{flex:none}
    .entry{grid-template-columns:32px 1fr auto;grid-template-rows:auto auto;gap:16px}
    .idx{grid-column:1;grid-row:1}
    .word-col{grid-column:2;grid-row:1}
    .use-col{grid-column:2 / 4;grid-row:2;padding-top:0}
    .master{grid-column:3;grid-row:1;align-self:start;height:36px;padding:0 14px}
  }
  @media (max-width:640px){
    body{font-size:14px}
    .masthead{padding:30px 0 22px}
    .lede{font-size:12.5px}
    h1{font-size:44px}
    .progress-read strong{font-size:52px}
    .units{padding:14px 0 14px;gap:6px}
    .unit-tab{min-width:96px;padding:8px 12px 9px}
    .unit-tab .u-label{font-size:14.5px}
    .toolbar-inner{padding:11px 0;gap:9px}
    .search{flex:1 1 100%}
    .search input{height:44px}
    .actions{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;
    }
    .actions .divider{display:none}
    .btn{height:40px;justify-content:center;padding:0 8px;font-size:11.5px}
    .btn:last-child{grid-column:1 / -1}
    .list-meta{padding:20px 2px 8px}
    .entry{padding:20px 4px;gap:12px;grid-template-columns:26px 1fr auto}
    .idx{padding-top:6px}
    .word{font-size:26px}
    .zh{font-size:13px}
    .colloc{font-size:15.5px}
    .ex{font-size:12px}
    .master{height:34px;padding:0 11px;font-size:11.5px}
    .empty{padding:52px 4px 64px}
    footer{flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:34px}
    footer .rule{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
  ::selection{background:rgba(30,58,43,.16)}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="title-wrap">
      <p class="kicker"><span class="dot"></span>Academic Word List · Sublists 5–10</p>
      <h1>Sublist <em>Five – Ten</em></h1>
      <p class="lede">学术词表 330 词 · 六个单元 · 逐词标记掌握进度</p>
    </div>
    <div class="progress-block" aria-label="当前单元掌握进度">
      <div class="progress-label">
        <span id="progressUnit">Sublist 5</span>
        <span id="rateText">0%</span>
      </div>
      <div class="progress-read">
        <strong id="masteredNum">0</strong><span id="totalNum">/ 60</span>
      </div>
      <div class="bar"><i id="progressBar"></i></div>
      <div class="progress-note" id="progressNote">剩余 60 词 · 进度自动保存</div>
    </div>
  </header>

  <nav class="units" id="units" aria-label="选择单元"></nav>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><line x1="16" y1="16" x2="21" y2="21"></line></svg>
        <label class="sr-only" for="searchInput">搜索单词或释义</label>
        <input id="searchInput" type="search" placeholder="搜索单词、中文或用法…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索">×</button>
      </div>
      <div class="actions">
        <button class="btn" id="toggleDetails" type="button" aria-pressed="false">隐藏释义</button>
        <button class="btn" id="undoBtn" type="button" disabled>撤销一步</button>
        <button class="btn" id="restoreBtn" type="button" disabled>恢复本单元</button>
        <span class="divider" aria-hidden="true"></span>
        <button class="btn quiet" id="exportLeft" type="button">导出当前 · 剩余</button>
        <button class="btn quiet" id="exportDone" type="button">导出当前 · 已掌握</button>
        <button class="btn quiet" id="exportAllLeft" type="button">导出全部 · 剩余</button>
        <button class="btn accent" id="exportAllDone" type="button">导出全部 · 已掌握</button>
      </div>
    </div>
  </div>

  <main>
    <div class="list-meta">
      <span id="listLabel">Sublist 5 · 60 词</span>
      <span class="count" id="resultCount">剩余 60</span>
    </div>
    <ul class="entries" id="entries"></ul>
    <div class="empty" id="empty" hidden>
      <div class="mark">/</div>
      <h3 id="emptyTitle">没有匹配的单词</h3>
      <p id="emptyText">换一个拼写，或清空搜索条件。</p>
      <button class="btn" id="emptyAction" type="button">清空搜索</button>
    </div>
    <footer>
      <span>数据：AWL Sublist 5–10（zbenglish.net）</span>
      <span class="rule"></span>
      <span id="footNote">330 词 · 学习记录仅保存在本机浏览器</span>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {

  var STORE_KEY = "awl6.state.v1";
  var LEGACY_KEY = "awl5.mastered.v1";
  var LEGACY_MASK = "awl5.masked.v1";

  var storageOK = true;
  function read(key, fallback, rawMode) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return rawMode ? raw : JSON.parse(raw);
    } catch (e) {
      storageOK = false;
      return fallback;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      storageOK = false;
      toast("当前浏览器无法保存进度，本次操作仅在页面内有效");
    }
  }
  function writeRaw(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { storageOK = false; }
  }

  function validIds(arr, total) {
    if (!Array.isArray(arr)) return [];
    var seen = {};
    return arr.filter(function (id) {
      return typeof id === "number" && isFinite(id) && id >= 0 && id < total && !seen[id] && (seen[id] = true);
    });
  }

  function defaultState() {
    var m = {}, u = {};
    UNITS.forEach(function (un) {
      m[un.key] = [];
      u[un.key] = [];
    });
    return { v: 1, unit: UNITS[0].key, mastered: m, undo: u, masked: false };
  }

  var saved = read(STORE_KEY, null);
  var state = defaultState();
  var firstRun = false;

  if (saved && typeof saved === "object" && saved.mastered) {
    state.unit = saved.unit;
    state.masked = saved.masked === true;
    UNITS.forEach(function (un) {
      state.mastered[un.key] = validIds(saved.mastered[un.key], un.words.length);
      state.undo[un.key] = validIds(saved.undo && saved.undo[un.key], un.words.length);
    });
  } else {
    firstRun = true;
    var legacy = read(LEGACY_KEY, []);
    if (Array.isArray(legacy) && legacy.length) {
      state.mastered[UNITS[0].key] = validIds(legacy, UNITS[0].words.length);
    }
    state.masked = read(LEGACY_MASK, false) === true;
    writeRaw(LEGACY_KEY, "");
    writeRaw(LEGACY_MASK, "");
  }

  var unitMap = {};
  UNITS.forEach(function (un) { unitMap[un.key] = un; });
  if (!unitMap[state.unit]) state.unit = UNITS[0].key;

  var mastered = {};
  var undoStack = {};
  UNITS.forEach(function (un) {
    mastered[un.key] = new Set(state.mastered[un.key]);
    undoStack[un.key] = state.undo[un.key].slice();
  });
  var masked = state.masked;

  var entriesEl = document.getElementById("entries");
  var emptyEl = document.getElementById("empty");
  var emptyTitle = document.getElementById("emptyTitle");
  var emptyText = document.getElementById("emptyText");
  var emptyAction = document.getElementById("emptyAction");
  var unitsEl = document.getElementById("units");
  var searchInput = document.getElementById("searchInput");
  var searchWrap = document.getElementById("searchWrap");
  var searchClear = document.getElementById("searchClear");
  var masteredNum = document.getElementById("masteredNum");
  var totalNum = document.getElementById("totalNum");
  var progressUnit = document.getElementById("progressUnit");
  var progressBar = document.getElementById("progressBar");
  var progressNote = document.getElementById("progressNote");
  var rateText = document.getElementById("rateText");
  var resultCount = document.getElementById("resultCount");
  var listLabel = document.getElementById("listLabel");
  var footNote = document.getElementById("footNote");
  var toggleDetailsBtn = document.getElementById("toggleDetails");
  var undoBtn = document.getElementById("undoBtn");
  var restoreBtn = document.getElementById("restoreBtn");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  var restoreArmed = false;
  var restoreTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  function save() {
    var snapshot = defaultState();
    snapshot.unit = state.unit;
    snapshot.masked = masked;
    UNITS.forEach(function (un) {
      snapshot.mastered[un.key] = Array.from(mastered[un.key]);
      snapshot.undo[un.key] = undoStack[un.key].slice();
    });
    write(STORE_KEY, snapshot);
  }

  function currentUnit() {
    return unitMap[state.unit];
  }

  function currentSet() {
    return mastered[state.unit];
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function splitUsage(raw) {
    var parts = String(raw).split("｜").map(function (s) { return s.trim(); });
    return { pos: parts[0] || "", colloc: parts[1] || "", example: parts.slice(2).join(" ｜ ").trim() };
  }

  function rowHTML(item, id) {
    var u = splitUsage(item.usage);
    var concealed = masked ? " concealed" : "";
    return '<li class="entry" data-id="' + id + '">' +
      '<span class="idx">' + pad(id + 1) + '</span>' +
      '<div class="word-col details' + concealed + '">' +
        '<h2 class="word">' + escapeHTML(item.w) + '</h2>' +
        '<p class="zh">' + escapeHTML(item.zh) + '</p>' +
        '<button class="reveal-hint" type="button" data-reveal="' + id + '"><span class="underline">轻触揭晓</span> 中文与用法</button>' +
      '</div>' +
      '<div class="use-col details' + concealed + '">' +
        '<div class="use-body">' +
          '<p class="pos">' + escapeHTML(u.pos) + '</p>' +
          '<p class="colloc">' + escapeHTML(u.colloc) + '</p>' +
          '<p class="ex">' + escapeHTML(u.example) + '</p>' +
        '</div>' +
      '</div>' +
      '<button class="master" type="button" data-master="' + id + '" aria-label="标记 ' + escapeHTML(item.w) + ' 为已掌握">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>' +
        '<span>已掌握</span>' +
      '</button>' +
    '</li>';
  }

  function query() {
    return searchInput.value.trim().toLowerCase();
  }

  function matches(item, q) {
    if (!q) return true;
    return (item.w + " " + item.zh + " " + item.usage).toLowerCase().indexOf(q) !== -1;
  }

  function visibleIds() {
    var q = query();
    var unit = currentUnit();
    var set = currentSet();
    var ids = [];
    for (var i = 0; i < unit.words.length; i++) {
      if (!set.has(i) && matches(unit.words[i], q)) ids.push(i);
    }
    return ids;
  }

  function renderTabs() {
    UNITS.forEach(function (un) {
      var tab = unitsEl.querySelector('[data-unit="' + un.key + '"]');
      if (!tab) return;
      var done = mastered[un.key].size;
      var pct = Math.round((done / un.words.length) * 100);
      tab.querySelector(".u-count").textContent = done + " / " + un.words.length;
      tab.querySelector(".u-bar i").style.width = pct + "%";
      var active = un.key === state.unit;
      tab.classList.toggle("active", active);
      if (active) tab.setAttribute("aria-current", "true");
      else tab.removeAttribute("aria-current");
    });
  }

  function render() {
    var unit = currentUnit();
    var set = currentSet();
    var ids = visibleIds();
    entriesEl.innerHTML = ids.map(function (id) { return rowHTML(unit.words[id], id); }).join("");

    var q = query();
    var remaining = unit.words.length - set.size;

    listLabel.textContent = unit.label + " · " + unit.words.length + " 词";
    searchInput.placeholder = "搜索单词、中文或用法…";
    footNote.textContent = UNITS.reduce(function (a, u) { return a + u.words.length; }, 0) + " 词 · 学习记录仅保存在本机浏览器";

    emptyEl.hidden = ids.length > 0;
    if (ids.length === 0) {
      if (remaining === 0) {
        emptyTitle.textContent = unit.label + " 已全部掌握";
        emptyText.textContent = "本单元 " + unit.words.length + " 个词都已标记完成，可恢复本单元或导出已掌握词表。";
        emptyAction.textContent = "恢复本单元";
        emptyAction.dataset.mode = "restore";
      } else if (q) {
        emptyTitle.textContent = "没有匹配的单词";
        emptyText.textContent = "未找到包含「" + searchInput.value.trim() + "」的词条，试试其他拼写。";
        emptyAction.textContent = "清空搜索";
        emptyAction.dataset.mode = "clear";
      } else {
        emptyTitle.textContent = "列表为空";
        emptyText.textContent = "全部单词都已标记为已掌握。";
        emptyAction.textContent = "恢复本单元";
        emptyAction.dataset.mode = "restore";
      }
    }

    resultCount.textContent = q
      ? "匹配 " + ids.length + " · 剩余 " + remaining
      : "剩余 " + remaining;
    updateStats();
  }

  function updateStats() {
    var unit = currentUnit();
    var done = currentSet().size;
    var total = unit.words.length;
    var remaining = total - done;
    var pct = Math.round((done / total) * 100);
    progressUnit.textContent = unit.label;
    masteredNum.textContent = done;
    totalNum.textContent = "/ " + total;
    progressBar.style.width = pct + "%";
    rateText.textContent = pct + "%";
    progressNote.textContent = (storageOK ? "剩余 " + remaining + " 词 · 进度自动保存" : "剩余 " + remaining + " 词 · 进度未保存");
    undoBtn.disabled = undoStack[unit.key].length === 0;
    restoreBtn.disabled = done === 0;
    toggleDetailsBtn.textContent = masked ? "显示释义" : "隐藏释义";
    toggleDetailsBtn.setAttribute("aria-pressed", masked ? "true" : "false");
    renderTabs();
  }

  function updateOne(id, delay) {
    var node = entriesEl.querySelector('[data-id="' + id + '"]');
    if (!node) return;
    node.classList.add("leaving");
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
      var unit = currentUnit();
      var left = unit.words.length - currentSet().size;
      if (!entriesEl.children.length) {
        render();
      } else {
        resultCount.textContent = query()
          ? "匹配 " + entriesEl.children.length + " · 剩余 " + left
          : "剩余 " + left;
        updateStats();
      }
    }, delay || 320);
  }

  function markMastered(id, announce) {
    var unit = currentUnit();
    var set = currentSet();
    if (set.has(id)) return;
    set.add(id);
    var stack = undoStack[unit.key];
    stack.push(id);
    if (stack.length > 200) stack.shift();
    save();
    updateStats();
    updateOne(id);
    if (announce) toast("已标记掌握：" + unit.words[id].w);
  }

  function undo() {
    var unit = currentUnit();
    var set = currentSet();
    var stack = undoStack[unit.key];
    while (stack.length) {
      var id = stack.pop();
      if (set.has(id)) {
        set.delete(id);
        save();
        render();
        var node = entriesEl.querySelector('[data-id="' + id + '"]');
        if (node) {
          node.classList.add("flash");
          if (typeof node.scrollIntoView === "function" && query() === "") {
            node.scrollIntoView({ block: "center", behavior: "smooth" });
          }
        }
        toast("已撤销：" + unit.words[id].w + " 回到列表");
        return;
      }
    }
    updateStats();
  }

  function restoreAll(silent) {
    var unit = currentUnit();
    var set = currentSet();
    if (!set.size) return;
    var count = set.size;
    set.clear();
    undoStack[unit.key] = [];
    save();
    resetRestoreBtn();
    render();
    if (!silent) toast("已恢复 " + unit.label + " 的 " + count + " 个单词");
  }

  function switchUnit(key) {
    if (!unitMap[key] || key === state.unit) return;
    state.unit = key;
    save();
    searchInput.value = "";
    searchWrap.classList.remove("has-value");
    resetRestoreBtn();
    render();
    toast("已切换到 " + unitMap[key].label);
  }

  // -- unit tabs --
  UNITS.forEach(function (un) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "unit-tab";
    b.setAttribute("data-unit", un.key);
    b.innerHTML = '<span class="u-label">' + un.label + '</span>' +
      '<span class="u-count">0 / ' + un.words.length + '</span>' +
      '<span class="u-bar"><i></i></span>';
    b.addEventListener("click", function () { switchUnit(un.key); });
    unitsEl.appendChild(b);
  });

  // -- search --
  function onSearch() {
    searchWrap.classList.toggle("has-value", searchInput.value.length > 0);
    render();
  }
  searchInput.addEventListener("input", onSearch);
  searchClear.addEventListener("click", function () {
    searchInput.value = "";
    onSearch();
    searchInput.focus();
  });

  // -- delegation --
  entriesEl.addEventListener("click", function (e) {
    var masterBtn = e.target.closest("[data-master]");
    if (masterBtn) {
      markMastered(Number(masterBtn.getAttribute("data-master")), true);
      return;
    }
    var revealBtn = e.target.closest("[data-reveal]");
    if (revealBtn) {
      var id = revealBtn.getAttribute("data-reveal");
      var card = entriesEl.querySelector('[data-id="' + id + '"]');
      if (card) {
        var parts = card.querySelectorAll(".details");
        for (var i = 0; i < parts.length; i++) parts[i].classList.remove("concealed");

    }
  });

  // -- toolbar --
  toggleDetailsBtn.addEventListener("click", function () {
    masked = !masked;
    save();
    render();
    toast(masked ? "已隐藏中文与用法，可逐词轻触揭晓" : "已显示全部中文与用法");
  });

  undoBtn.addEventListener("click", undo);

  function resetRestoreBtn() {
    restoreArmed = false;
    restoreBtn.textContent = "恢复本单元";
    restoreBtn.classList.remove("accent");
    clearTimeout(restoreTimer);
  }

  restoreBtn.addEventListener("click", function () {
    if (!restoreArmed) {
      restoreArmed = true;
      restoreBtn.textContent = "确认恢复本单元？";
      restoreBtn.classList.add("accent");
      clearTimeout(restoreTimer);
      restoreTimer = setTimeout(resetRestoreBtn, 3000);
      return;
    }
    restoreAll(false);
  });

  // -- empty action --
  emptyAction.addEventListener("click", function () {
    if (emptyAction.dataset.mode === "restore") {
      restoreAll(false);
    } else {
      searchInput.value = "";
      onSearch();
      searchInput.focus();
    }
  });

  // -- export --
  function csvCell(value) {
    return '"' + String(value).replace(/"/g, '""') + '"';
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }

  function downloadCSV(records, namePart, label) {
    if (!records.length) {
      toast("没有可导出的单词");
      return;
    }
    var rows = [["单元", "序号", "单词", "中文翻译", "用法"].map(csvCell).join(",")];
    records.forEach(function (r) {
      rows.push([r.unit, r.index, r.word, r.zh, r.usage].map(csvCell).join(","));
    });
    var csv = "\uFEFF" + rows.join("\r\n") + "\r\n";
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "AWL-" + namePart + "-" + stamp() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("已导出 " + records.length + " 条：" + label);
  }

  function unitRecords(unit, mode) {
    var set = mastered[unit.key];
    var out = [];
    for (var i = 0; i < unit.words.length; i++) {
      var isDone = set.has(i);
      if ((mode === "done") === isDone) {
        var item = unit.words[i];
        out.push({ unit: unit.label, index: i + 1, word: item.w, zh: item.zh, usage: item.usage });
      }
    }
    return out;
  }

  function allRecords(mode) {
    var out = [];
    UNITS.forEach(function (un) {
      out = out.concat(unitRecords(un, mode));
    });
    return out;
  }

  document.getElementById("exportLeft").addEventListener("click", function () {
    downloadCSV(unitRecords(currentUnit(), "left"), currentUnit().label + "-剩余", currentUnit().label + " 剩余");
  });
  document.getElementById("exportDone").addEventListener("click", function () {
    downloadCSV(unitRecords(currentUnit(), "done"), currentUnit().label + "-已掌握", currentUnit().label + " 已掌握");
  });
  document.getElementById("exportAllLeft").addEventListener("click", function () {
    downloadCSV(allRecords("left"), "Sublist5-10-全部剩余", "全部单元剩余");
  });
  document.getElementById("exportAllDone").addEventListener("click", function () {
    downloadCSV(allRecords("done"), "Sublist5-10-全部已掌握", "全部单元已掌握");
  });

  // -- keyboard: cmd/ctrl+z undo, "/" focus search --
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    var typing = tag === "input" || tag === "textarea";
    if ((e.metaKey || e.ctrlKey) && e.key && e.key.toLowerCase() === "z" && !typing) {
      if (undoStack[state.unit].length) { e.preventDefault(); undo(); }
    }
    if (e.key === "/" && !typing) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  // -- init --
  if (firstRun) save();
  render();
})();
</script>
</body>
</html>
